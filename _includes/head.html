<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description }}" />
    <meta name="author" content="{{ site.author }}" />
    <meta name="keywords" content="{{ site.keywords }}" />
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <title>{{ site.title }} {% if page.title %} | {{ page.title }}{% endif %}</title>
    {% feed_meta %}
    {% seo %}

    <!-- Bootstrap Core CSS -->
    <link href="{{ site.baseurl }}/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ site.baseurl }}/css/grayscale.css" rel="stylesheet">
    <link href="{{ site.baseurl }}/css/timeline.css" rel="stylesheet">
    <link href="{{ site.baseurl }}/css/styles.css" rel="stylesheet">
    
    <!-- Custom Fonts -->
    <link href="{{ site.baseurl }}/font-awesome/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

</head>
