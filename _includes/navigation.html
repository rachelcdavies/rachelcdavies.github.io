    <!-- Navigation -->
    <nav class="navbar navbar-custom navbar-fixed-top" aria-label="Main navigation">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-main-collapse" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <a class="navbar-brand page-scroll" href="#page-top">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>  {{ site.title }}
                </a>
            </div>

            <!-- Collect the nav links, forms, and other content for toggling -->
            <div class="collapse navbar-collapse navbar-right navbar-main-collapse" id="main-nav">
                <ul class="nav navbar-nav">
                    <!-- Hidden li included to remove active class from about link when scrolled up past about section -->
                    <li class="hidden">
                        <a href="#page-top" tabindex="-1" aria-hidden="true"></a>
                    </li>
                    {% for page in site.pages %}
                    {% unless page.url == "/index.html" || page.url == "/blog.html" %}
                    <li>
                        <a class="page-scroll" href="#{{ page.title }}">{{ page.title }}</a>
                    </li>
                    {% endunless %}
                    {% endfor %}
                </ul>
            </div>
            <!-- /.navbar-collapse -->
        </div>
        <!-- /.container -->
