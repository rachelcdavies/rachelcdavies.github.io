    <!-- Intro Header -->
    <header class="intro">
        <div class="intro-body">
            <div class="container">
                <div class="row">
                    <div class="col-md-8 col-md-offset-2">
                        <h1 class="brand-heading"><span class="sr-only">{{ site.title }}</span>&nbsp;</h1>
                        <p class="intro-text">{{ content }}</p>
                        {% capture title %}{% for page in site.pages | sort: "title" %}{% if forloop.first %}{{ page.title }}{% endif %}{% endfor %}{% endcapture %}
                        <a href="#{{ title }}" class="btn btn-circle page-scroll" aria-label="Scroll to content">
                            <i class="fa-solid fa-angles-down animated" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>
